version: "3.7"

services:
  rails:
    build: .
    restart: unless-stopped
    container_name: sptools-rails-dev
    environment:
      - RAILS_ENV=development
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=${DATABASE_HOST}
    ports:
      - "${RAILS_PORT:-3002}:3000"
    volumes:
      - .:/app
      - gem-cache:/usr/local/bundle
    networks:
      - matias-network
    command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && (bundle check || bundle install) && bundle exec rails s -p 3000 -b '0.0.0.0'"]
    stdin_open: true
    tty: true

volumes:
  gem-cache:

networks:
  matias-network:
    driver: bridge
